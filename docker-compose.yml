version: '3.8'

services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smart-audit-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - smart-audit-net

  backend:
    build:
      context: ./smart-audit-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    env_file:
      - ./smart-audit-backend/.env.backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      WEB3_PROVIDER: ${WEB3_PROVIDER}
      PRIVATE_KEY: ${PRIVATE_KEY}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS}
      PINATA_JWT: ${PINATA_JWT}
      PINATA_GATEWAY: ${PINATA_GATEWAY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    volumes:
      - ./smart-audit-backend/app:/app/app
      - ./smart-audit-backend/uploads:/app/uploads
      - ./smart-audit-backend/smart-audit-chain:/app/smart-audit-chain
    networks:
      - smart-audit-net

  frontend:
    build:
      context: ./smart-audit-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      # Browser must access localhost, NOT 'backend'
      VITE_API_URL: "http://localhost:8000"
    networks:
      - smart-audit-net

networks:
  smart-audit-net:
    driver: bridge

volumes:
  postgres_data: