name: Smart Contract Audit CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          pip install -r smart-audit-backend/requirements.txt
          pip install pytest pytest-asyncio flake8

      - name: Lint Backend
        run: |
          cd smart-audit-backend
          flake8 app

      - name: Run Backend Tests
        if: ${{ hashFiles('smart-audit-backend/tests/**/*.py') != '' }}
        run: |
          cd smart-audit-backend
          if [ -d "tests" ]; then
            pytest tests/ --cov=app --cov-report=xml || true
          else
            echo "No tests directory found, skipping tests"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Frontend Dependencies
        run: |
          cd smart-audit-frontend
          npm install

      - name: Lint Frontend
        run: |
          cd smart-audit-frontend
          npm run lint

      - name: Run Frontend Tests
        if: ${{ hashFiles('smart-audit-frontend/src/**/*.test.{js,jsx,ts,tsx}') != '' || hashFiles('smart-audit-frontend/src/**/*.spec.{js,jsx,ts,tsx}') != '' }}
        run: |
          cd smart-audit-frontend
          if npm run test 2>/dev/null; then
            npm test -- --coverage || true
          else
            echo "No test script found, skipping tests"
          fi

      - name: Run Slither Analysis
        run: |
          pip install slither-analyzer
          mkdir -p slither-reports
          for file in smart-audit-backend/smart-audit-chain/contracts/*.sol; do
            echo "Auditing $file"
            slither "$file" --json slither-reports/$(basename "$file" .sol)_report.json || echo "Slither found issues"
          done

      - name: Upload Slither Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slither-reports
          path: slither-reports

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Docker Image
        run: |
          docker build -t myrepo/smart-audit-backend:latest smart-audit-backend/
          docker push myrepo/smart-audit-backend:latest

      - name: Build and Push Frontend Docker Image
        run: |
          docker build -t myrepo/smart-audit-frontend:latest smart-audit-frontend/
          docker push myrepo/smart-audit-frontend:latest

      # Deploy job kept for future use when deployment is configured
      # Add your deployment steps here when ready