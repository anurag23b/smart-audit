name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Backend deps
        working-directory: smart-audit-backend
        run: |
          pip install -r requirements.txt
          python -m compileall app

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: smart-audit-frontend/package-lock.json

      - name: Frontend deps + build
        working-directory: smart-audit-frontend
        run: |
          npm ci
          npm run build

      - name: Docker build (frontend)
        run: docker build -t smart-audit-frontend ./smart-audit-frontend

      - name: Docker build (backend)
        run: docker build -t smart-audit-backend ./smart-audit-backend

