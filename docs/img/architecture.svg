<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-label="Smart Audit Architecture">
  <rect width="760" height="420" fill="#f8fafc"/>
  <rect x="40" y="40" width="200" height="90" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="140" y="80" text-anchor="middle" font-size="16" font-family="Arial" fill="#0f172a">Frontend (React)</text>
  <text x="140" y="105" text-anchor="middle" font-size="12" font-family="Arial" fill="#0f172a">Upload, Dashboard, Detail</text>

  <rect x="300" y="40" width="200" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="75" text-anchor="middle" font-size="16" font-family="Arial" fill="#0f172a">FastAPI Backend</text>
  <text x="400" y="98" text-anchor="middle" font-size="12" font-family="Arial" fill="#0f172a">Auth • Upload • Audit</text>
  <text x="400" y="118" text-anchor="middle" font-size="12" font-family="Arial" fill="#0f172a">JWT + Redis + DB</text>

  <rect x="560" y="40" width="150" height="90" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="635" y="80" text-anchor="middle" font-size="16" font-family="Arial" fill="#0f172a">LLM (OpenRouter)</text>
  <text x="635" y="105" text-anchor="middle" font-size="12" font-family="Arial" fill="#0f172a">Summaries</text>

  <rect x="60" y="190" width="160" height="90" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="140" y="230" text-anchor="middle" font-size="15" font-family="Arial" fill="#0f172a">Slither</text>
  <text x="140" y="250" text-anchor="middle" font-size="12" font-family="Arial" fill="#0f172a">Static Analysis</text>

  <rect x="300" y="190" width="160" height="90" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="380" y="230" text-anchor="middle" font-size="15" font-family="Arial" fill="#0f172a">Mythril</text>
  <text x="380" y="250" text-anchor="middle" font-size="12" font-family="Arial" fill="#0f172a">Symbolic Exec</text>

  <rect x="540" y="190" width="180" height="90" rx="10" fill="#e9d5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="630" y="230" text-anchor="middle" font-size="15" font-family="Arial" fill="#0f172a">Postgres</text>
  <text x="630" y="250" text-anchor="middle" font-size="12" font-family="Arial" fill="#0f172a">Audits, Issues, Users</text>

  <rect x="60" y="320" width="180" height="70" rx="10" fill="#ffe4e6" stroke="#f43f5e" stroke-width="2"/>
  <text x="150" y="355" text-anchor="middle" font-size="15" font-family="Arial" fill="#0f172a">IPFS</text>
  <text x="150" y="375" text-anchor="middle" font-size="12" font-family="Arial" fill="#0f172a">Pinata + NFT.Storage</text>

  <rect x="300" y="320" width="200" height="70" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="400" y="355" text-anchor="middle" font-size="15" font-family="Arial" fill="#0f172a">Blockchain</text>
  <text x="400" y="375" text-anchor="middle" font-size="12" font-family="Arial" fill="#0f172a">AuditScore.sol</text>

  <rect x="560" y="320" width="160" height="70" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text x="640" y="355" text-anchor="middle" font-size="15" font-family="Arial" fill="#0f172a">Redis</text>
  <text x="640" y="375" text-anchor="middle" font-size="12" font-family="Arial" fill="#0f172a">Rate limits / cache</text>

  <!-- Arrows -->
  <line x1="240" y1="85" x2="300" y2="85" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="85" x2="560" y2="85" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="160" x2="400" y2="190" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="235" x2="540" y2="235" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="220" y1="235" x2="300" y2="235" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="280" x2="400" y2="320" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="355" x2="300" y2="355" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="355" x2="560" y2="355" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0f172a"/>
    </marker>
  </defs>
</svg>

